# Views cycled with Shift_R + ] in the order set by `preset=` in MangoHud.conf: 5 → 0 → 6 → 7.
# Only HUD items belong here; style/colours/keys are in MangoHud.conf and apply to every view.
# 0 = MangoHud's built-in "no HUD". 5-7 are custom so they never collide with built-ins 0-4.

[preset 5]
# full
gpu_stats
gpu_name
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
gpu_voltage
vram
throttling_status
cpu_stats
cpu_temp
cpu_power
cpu_mhz
ram
swap
fps
fps_metrics=avg,0.01
frametime
frame_timing
engine_version
vulkan_driver
wine
winesync
present_mode
resolution
refresh_rate
display_server
time

[preset 6]
# fps only, bigger
font_size=26
background_alpha=0.3
fps

[preset 7]
# compact
gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram
fps
fps_metrics=avg,0.01
frametime
frame_timing
