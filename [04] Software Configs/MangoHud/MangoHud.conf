### Keys (60%-keyboard friendly — right Shift + the punctuation cluster beside it):
###   Shift_R + \   HUD on/off        Shift_R + ]   cycle view: full → off → fps only → compact
###   Shift_R + [   cycle fps cap 0 / 141 / 72          Shift_R + '   move HUD to next corner
###   Shift_R + ;   start/stop 60 s frametime log
### Colours: "arctic neon" — near-black navy glass, ice-white text, saturated cold neons that stay
###          readable over anything (cyan GPU, lime CPU, violet VRAM, gold RAM), hot pink for warnings. Docs: https://github.com/flightlessmango/MangoHud

## views (presets.conf): 5 = full, 0 = off (built-in), 6 = fps only, 7 = compact
preset=5,0,6,7
toggle_preset=Shift_R+bracketright

## ------------------------------------------------------------ look
legacy_layout=0
font_file=/home/swapnanil/.config/MangoHud/JetBrainsMono-Regular.ttf
font_size=22
font_scale=1.0
text_outline=1
text_outline_thickness=2
text_outline_color=000000
round_corners=10
background_alpha=0.6
background_color=05080f
text_color=e8f1ff
position=top-left
offset_x=12
offset_y=12
table_columns=3

## colours per block
gpu_color=33d6ff
cpu_color=a8ff60
vram_color=b388ff
ram_color=ffd166
engine_color=8c9bb3
frametime_color=33d6ff
wine_color=8c9bb3
io_color=33d6ff

## thresholds (colour changes) — flags, not HUD items
gpu_load_change
gpu_load_value=60,90
gpu_load_color=33d6ff,ffd166,ff3b6b
cpu_load_change
cpu_load_value=60,90
cpu_load_color=a8ff60,ffd166,ff3b6b
fps_color_change
fps_value=60,120
fps_color=ff3b6b,ffd166,5cff8a
time_format=%H:%M

## ------------------------------------------------------------ control
toggle_hud=Shift_R+backslash
toggle_hud_position=Shift_R+apostrophe
fps_limit=0,141,72              # 0 = uncapped; 141 keeps VRR engaged at 144 Hz; 72 = half rate
fps_limit_method=late           # lowest latency; use "early" if a game stutters with it
toggle_fps_limit=Shift_R+bracketleft
vsync=0
gl_vsync=-1

## logging (Shift_R+;) → CSV in ~/Videos/mangohud-logs
toggle_logging=Shift_R+semicolon
output_folder=/home/swapnanil/Videos/mangohud-logs
log_duration=60
log_interval=100
autostart_log=0
